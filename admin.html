<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOLT — Адмін-панель</title><link rel="stylesheet" href="/style.css"><style>
.admin{max-width:1100px;margin:35px auto;padding:20px}.admin h1{font-size:34px}.login{max-width:420px;background:#101827;padding:24px;border-radius:16px;color:white}.login input{display:block;margin:12px 0}.orders{display:grid;gap:12px;margin-top:20px}.ordercard{background:white;border-radius:14px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:12px}.ordercard p{margin:6px 0;color:#475467}.ordercard select{background:#101827;max-width:190px}.muted{color:#667085;font-size:13px}@media(max-width:650px){.ordercard{grid-template-columns:1fr}}
</style></head><body><header><a class="logo" href="/">VOLT<span>.</span></a><a class="navbuy" href="/">До магазину ↗</a></header><main class="admin"><h1>Замовлення</h1><div class="login" id="login"><b>Вхід адміністратора</b><input id="pass" type="password" placeholder="Пароль адміністратора"><button class="button" id="enter">Увійти</button><p id="err"></p></div><div id="dashboard" hidden><p class="muted">Список замовлень оновлюється вручну кнопкою нижче.</p><button class="button" id="refresh">Оновити замовлення</button><div class="orders" id="orders"></div></div></main><script>
let password="";const $=id=>document.getElementById(id);async function load(){const r=await fetch("/.netlify/functions/admin",{headers:{"x-admin-password":password}});if(!r.ok)throw new Error((await r.json()).error||"Помилка");const rows=await r.json();$("orders").innerHTML="";if(!rows.length){$("orders").textContent="Замовлень поки немає.";return;}for(const o of rows){const el=document.createElement("article");el.className="ordercard";const left=document.createElement("div");left.innerHTML=`<b>Замовлення #${o.id}</b><p>${o.name} · ${o.phone}</p><p>${o.delivery}</p><p>${o.color} · ${o.quantity} шт. · ${o.total} грн</p><p class="muted">${new Date(o.created_at).toLocaleString("uk-UA")}</p>`;const select=document.createElement("select");["Новий","Підтверджений","Відправлений","Доставлений","Скасований"].forEach(s=>{const op=document.createElement("option");op.value=s;op.textContent=s;if(o.status===s)op.selected=true;select.append(op)});select.onchange=async()=>{await fetch("/.netlify/functions/admin",{method:"PATCH",headers:{"Content-Type":"application/json","x-admin-password":password},body:JSON.stringify({id:o.id,status:select.value})});};el.append(left,select);$("orders").append(el);}}
$("enter").onclick=async()=>{password=$("pass").value;try{await load();$("login").hidden=true;$("dashboard").hidden=false;}catch(e){$("err").textContent=e.message;}};$("refresh").onclick=()=>load().catch(e=>alert(e.message));
</script></body></html>
